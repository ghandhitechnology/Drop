name: Release verification

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  root:
    name: Engine and backend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Clean install root workspaces
        run: npm ci

      - name: Test engine and backend
        run: npm test

      - name: Typecheck engine and backend
        run: npm run typecheck --workspaces --if-present

  mobile:
    name: Mobile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Clean install mobile dependencies
        run: npm ci

      - name: Test mobile
        run: npm test

      - name: Typecheck mobile
        run: npm run typecheck

      - name: Lint mobile
        run: npm run lint

      - name: Check mobile contrast
        run: npm run check-contrast

      - name: Check Expo project health
        run: npm run doctor

  pipeline:
    name: Factor pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Require exact pipeline dependency pins
        run: |
          python - <<'PY'
          from pathlib import Path

          requirements = Path("pipeline/requirements.txt").read_text().splitlines()
          unpinned = [
              line for line in requirements
              if line.strip() and not line.lstrip().startswith("#") and "==" not in line
          ]
          if unpinned:
              raise SystemExit(f"unpinned pipeline requirements: {unpinned}")
          PY

      - name: Install pinned pipeline dependencies
        run: python -m pip install --requirement pipeline/requirements.txt

      - name: Test factor pipeline and mobile seed parity
        run: python -m pytest pipeline/tests -q
