# Hand-curated catalog overrides for Drop's SU-EATABLE food catalog.
#
# typology_defaults: default purchase/serving quantity per SU-EATABLE typology.
# item_overrides:    per-item quantity/unit/basis overrides where the typology
#                    default is a poor fit (e.g. a whole watermelon wedge vs a
#                    generic piece of fruit).
# synonyms:          everyday search words/phrases (incl. Korean for top items)
#                    that should resolve to a given catalog item.
# recipes:           composite dishes built from catalog items, with as-consumed
#                    mass/volume fractions that sum to 1.0.
# display_overrides: friendlier display names for awkward auto-title-cased items.

