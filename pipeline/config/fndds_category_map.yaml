  "Ready-to-eat cereal, higher sugar (>21.2g/100g)": sel:typ:agricultural_processed__breakfast_cereals
  "Ready-to-eat cereal, lower sugar (=<21.2g/100g)": sel:typ:agricultural_processed__breakfast_cereals
  Candy containing chocolate: sel:typ:agricultural_processed__cocoa_derivates

  Coffee: sel:typ:agricultural_processed__coffee_liquid
  Beer: sel:typ:agricultural_processed__beer
